<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Whimsey Technologies — Download the Android app</title>
    <meta
      name="description"
      content="Download the Whimsey Technologies Android app. Google Play and the App Store are coming soon."
    />
    <meta name="theme-color" content="#0056D2" />
    <meta property="og:title" content="Whimsey Technologies — Download the Android app" />
    <meta
      property="og:description"
      content="Download the Whimsey Technologies Android app. Google Play and the App Store are coming soon."
    />
    <meta property="og:image" content="assets/whimsey-logo.png" />
    <link rel="icon" href="assets/whimsey-logo.png" />
    <link rel="preload" href="assets/Jost-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <style>
      @font-face {
        font-family: Jost;
        src: url("assets/Jost-Variable.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --blue: #0056d2;
        --blue-pressed: #0047b3;
        --ink: #0f172a;
        --muted: #475569;
        --line: rgba(15, 23, 42, 0.08);
        --navy: #0b0f19;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background: #fff;
        color: var(--ink);
        font-family: Jost, "Segoe UI", sans-serif;
      }

      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: min(440px, calc(100% - 40px));
        margin: 0 auto;
        padding: 48px 0 40px;
        text-align: center;
      }

      .logo {
        width: min(220px, 70%);
        height: auto;
      }

      .kicker {
        margin: 28px 0 0;
        color: var(--blue);
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 10px 0 0;
        font-size: clamp(2rem, 6vw, 2.6rem);
        font-weight: 500;
        letter-spacing: -0.035em;
        line-height: 1.05;
      }

      .tagline {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.5;
      }

      .download {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        min-height: 54px;
        margin-top: 28px;
        border-radius: 12px;
        background: var(--blue);
        color: #fff;
        font-size: 1.05rem;
        font-weight: 500;
        text-decoration: none;
        transition: background 0.2s ease, box-shadow 0.2s ease;
      }

      .download:hover {
        background: var(--blue-pressed);
        box-shadow: 0 10px 24px rgba(0, 86, 210, 0.24);
      }

      .download:focus-visible {
        outline: 3px solid rgba(0, 86, 210, 0.35);
        outline-offset: 3px;
      }

      .download svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .meta {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 0.92rem;
      }

      .store-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        width: 100%;
        margin-top: 28px;
      }

      .store {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 64px;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--navy);
        color: #fff;
        text-align: left;
      }

      .store-copy small {
        display: block;
        color: rgba(255, 255, 255, 0.68);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .store-copy strong {
        display: block;
        margin-top: 2px;
        font-size: 1rem;
        font-weight: 500;
        letter-spacing: -0.01em;
      }

      .play-icon,
      .apple-icon {
        width: 24px;
        height: 24px;
        flex: none;
      }

      footer {
        border-top: 1px solid var(--line);
      }

      .footer-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px 24px;
        width: min(880px, calc(100% - 40px));
        margin: 0 auto;
        padding: 18px 0;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .footer-inner a {
        color: var(--blue);
        font-weight: 500;
        text-decoration: none;
      }

      .footer-inner a:hover {
        text-decoration: underline;
      }

      @media (max-width: 520px) {
        main {
          justify-content: flex-start;
          padding-top: 36px;
        }

        .footer-inner {
          flex-direction: column;
          align-items: center;
          text-align: center;
        }
      }

      @media (max-width: 360px) {
        .store-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="assets/whimsey-logo.png" alt="Whimsey Tech" />
      <p class="kicker">Android app</p>
      <h1>Whimsey Technologies</h1>
      <p class="tagline">Light up your vision with precision-crafted tech.</p>

      <a class="download" href="downloads/WhimseyTech.apk" download="WhimseyTech.apk">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4v11" />
          <path d="M7 11l5 5 5-5" />
          <path d="M5 20h14" />
        </svg>
        Download for Android
      </a>
      <p class="meta">Version 1.0.0 · 22.5 MB</p>

      <div class="store-row">
        <div class="store">
          <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M3.2 2.4c-.5.3-.8.8-.8 1.5v16.2c0 .7.3 1.2.8 1.5l.2.1 9.1-9.1v-.2L3.4 2.3l-.2.1z" />
            <path fill="#34A853" d="M16.8 14.7l-4.1-4.1v-.2l4.1-4.1.1.1 4.8 2.7c1.4.8 1.4 2.1 0 2.9l-4.8 2.7-.1 0z" />
            <path fill="#FBBC04" d="M16.9 14.6L12.6 10.3 3.4 19.5c.5.5 1.2.5 2.1.1l11.4-5z" />
            <path fill="#EA4335" d="M16.9 8.4L5.5 2.4c-.9-.5-1.6-.4-2.1.1l9.2 9.2 4.3-3.3z" />
          </svg>
          <span class="store-copy">
            <small>Coming soon</small>
            <strong>Google Play</strong>
          </span>
        </div>
        <div class="store">
          <svg class="apple-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="#fff"
              d="M16.7 12.6c0-2.2 1.8-3.2 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.6.8-3.3.8s-1.7-.8-2.9-.8c-1.5 0-2.8.9-3.6 2.2-1.5 2.6-.4 6.5 1.1 8.7.7 1 1.6 2.2 2.7 2.1 1.1 0 1.5-.7 2.8-.7s1.7.7 2.9.7 1.9-1.1 2.6-2.1c.8-1.2 1.1-2.3 1.1-2.4-.1 0-2.1-.8-2.1-3.5zM14.9 6.4c.6-.7 1-1.7.9-2.7-.9.1-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 1.9-.5 2.5-1.2z"
            />
          </svg>
          <span class="store-copy">
            <small>Coming soon</small>
            <strong>App Store</strong>
          </span>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-inner">
        <span>© 2026 Whimsey Technologies</span>
        <a href="mailto:whimseytech@gmail.com">whimseytech@gmail.com</a>
      </div>
    </footer>
  </body>
</html>
